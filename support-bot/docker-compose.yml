services:
  legacy-support-bot:
    build:
      context: ..
      dockerfile: support-bot/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

